name: Keep Fedora Blv Alive

on:
  schedule:
    # Corre cada 5 minutos, 24/7 (así el sitio nunca llega a los 15 min de inactividad que lo duermen)
    - cron: '*/5 * * * *'
  workflow_dispatch: # permite tirarlo a mano desde GitHub para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping fedorablv.ar
        run: |
          echo "Haciendo ping a https://www.fedorablv.ar/ ..."
          # --max-time 90: espera hasta 90 segundos por respuesta (por si el servicio estaba dormido y tarda en despertar)
          # --retry 3: si falla, reintenta hasta 3 veces
          # --retry-delay 10: espera 10 segundos entre reintentos
          # --retry-all-errors: reintenta ante cualquier tipo de error, incluido timeout
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            https://www.fedorablv.ar/)
          echo "Respuesta HTTP: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Sitio despierto (código $response)"
          else
            echo "⚠️ Respuesta inesperada: $response"
            exit 1
          fi
